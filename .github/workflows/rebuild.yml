name: Rebuild website after admin edits
on:
  push:
    branches: [main]
    paths:
      - 'data/products.json'
      - 'data/site.json'
      - 'assets/img/uploads/**'
      - 'tools/build_site.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rebuild
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/build_site.py
      - name: Commit generated pages
        run: |
          git config user.name "senrex-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html products.html about.html contact.html assets/js/data.js data/texts_catalog.json data/site_defaults.json
          if git diff --cached --quiet; then echo "nothing to update"; exit 0; fi
          git commit -m "Rebuild pages from admin edits"
          git pull --rebase origin main
          git push
